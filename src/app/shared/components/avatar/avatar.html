<span
  class="eb-avatar"
  [class.eb-avatar--lg]="size === 'lg'"
  [class.eb-avatar--acento]="acento"
>
  <img *ngIf="src && !imagenRota; else sinFoto" [src]="src" [alt]="alt" (error)="imagenRota = true" />
  <ng-template #sinFoto>
    <span aria-hidden="true">{{ iniciales }}</span>
  </ng-template>
</span>
