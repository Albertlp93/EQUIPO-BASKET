<app-header [teamName]="teamName"></app-header>

<main class="container py-4">
  <div class="row g-4">
    <!-- Listado -->
    <div class="col-lg-5">
      <app-players
        [selectedPlayer]="jugadorSeleccionado"
        (playerSelected)="onPlayerSelected($event)"
      ></app-players>
    </div>

    <!-- Detalle y reproductor -->
    <div class="col-lg-7">
      <div *ngIf="jugadorSeleccionado; else sinSeleccion" class="d-grid gap-4">
        <app-detail [player]="jugadorSeleccionado" (closeDetail)="onCloseDetail()"></app-detail>
        <app-media
          [videoUrl]="jugadorSeleccionado.videoUrl"
          [titulo]="jugadorSeleccionado.nombre + ' ' + jugadorSeleccionado.apellidos"
        ></app-media>
      </div>

      <ng-template #sinSeleccion>
        <div class="eb-panel eb-vacio text-center text-secondary p-5">
          <i class="bi bi-person-badge d-block mb-2"></i>
          Selecciona un jugador del listado para ver su ficha y su vídeo.
        </div>
      </ng-template>
    </div>
  </div>
</main>
