<section *ngIf="videoUrl" class="eb-tarjeta p-3">
  <h3 class="eb-titulo-seccion eb-titulo-seccion--acento">Vídeo resumen</h3>

  <video
    #video
    class="eb-video"
    [src]="videoUrl"
    preload="metadata"
    playsinline
    (click)="togglePlay()"
    (loadedmetadata)="onLoadedMetadata()"
    (timeupdate)="onTimeUpdate()"
    (play)="onPlay()"
    (pause)="onPause()"
    (ended)="onPause()"
  ></video>

  <!-- Barra de progreso -->
  <div class="d-flex align-items-center gap-2 my-2">
    <span class="eb-tiempo">{{ tiempoActual | duration }}</span>
    <input
      type="range"
      class="eb-rango flex-grow-1"
      aria-label="Progreso del vídeo"
      min="0"
      step="0.1"
      [max]="duracion"
      [value]="tiempoActual"
      [disabled]="!duracion"
      (input)="seek($event)"
    />
    <span class="eb-tiempo">{{ duracion | duration }}</span>
  </div>

  <!-- Botones y volumen -->
  <div class="d-flex flex-wrap align-items-center gap-2">
    <button type="button" class="eb-btn eb-btn--primario" (click)="play()" [disabled]="reproduciendo">
      <i class="bi bi-play-fill"></i> Play
    </button>
    <button type="button" class="eb-btn" (click)="pause()" [disabled]="!reproduciendo">
      <i class="bi bi-pause-fill"></i> Pause
    </button>
    <button type="button" class="eb-btn" (click)="stop()">
      <i class="bi bi-stop-fill"></i> Stop
    </button>

    <div class="d-flex align-items-center gap-2 ms-auto">
      <button
        type="button"
        class="eb-mute"
        (click)="toggleMute()"
        [attr.aria-label]="silenciado ? 'Activar sonido' : 'Silenciar'"
      >
        <i class="bi" [ngClass]="silenciado || volumen === 0 ? 'bi-volume-mute-fill' : 'bi-volume-up-fill'"></i>
      </button>
      <input
        type="range"
        class="eb-rango eb-volumen"
        aria-label="Volumen"
        min="0"
        max="1"
        step="0.05"
        [value]="silenciado ? 0 : volumen"
        (input)="cambiarVolumen($event)"
      />
    </div>
  </div>
</section>
