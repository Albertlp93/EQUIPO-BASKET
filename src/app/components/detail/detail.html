@if (player) {
  <article class="eb-tarjeta p-3 p-md-4">
    <div class="d-flex align-items-center gap-3 mb-3">
      <app-avatar
        size="lg"
        [acento]="true"
        [src]="player.fotoUrl"
        [alt]="player.nombre + ' ' + player.apellidos"
      ></app-avatar>
      <div class="flex-grow-1">
        <h3 class="eb-detalle__nombre m-0">{{ player.nombre }} {{ player.apellidos }}</h3>
        <span class="text-acento small">{{ player.posicion }}</span>
      </div>
      <div class="d-flex gap-2 align-self-start">
        <!-- Ficha externa del jugador (se abre en otra pestaña) -->
        @if (player.infoUrl) {
          <a
            class="eb-btn eb-btn--info"
            [href]="player.infoUrl"
            target="_blank"
            rel="noopener noreferrer"
            title="Más información"
          >
            <svg class="eb-icono" aria-hidden="true">
              <use href="assets/icons/icons.svg#info"></use>
            </svg>
            Info
          </a>
        }
        <button type="button" class="eb-btn eb-btn--peligro" (click)="cerrar()">
          <svg class="eb-icono" aria-hidden="true"><use href="assets/icons/icons.svg#x"></use></svg>
          Cerrar
        </button>
      </div>
    </div>

    <dl class="row row-cols-2 row-cols-md-4 g-2 m-0">
      @for (dato of datos; track dato.etiqueta) {
        <div class="col">
          <div class="eb-dato">
            <dt>{{ dato.etiqueta }}</dt>
            <dd>{{ dato.valor }}</dd>
          </div>
        </div>
      }
    </dl>

    <p class="mt-3 mb-0 small text-suave">{{ player.biografia }}</p>
  </article>
}
