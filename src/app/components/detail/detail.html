<article *ngIf="player" class="eb-tarjeta p-3 p-md-4">
  <div class="d-flex align-items-center gap-3 mb-3">
    <app-avatar
      size="lg"
      [acento]="true"
      [src]="player.fotoUrl"
      [alt]="player.nombre + ' ' + player.apellidos"
    ></app-avatar>
    <div class="flex-grow-1">
      <h3 class="eb-detalle__nombre m-0">{{ player.nombre }} {{ player.apellidos }}</h3>
      <span class="text-acento small">{{ player.posicion }}</span>
    </div>
    <button type="button" class="eb-btn eb-btn--borde align-self-start" (click)="cerrar()">
      <i class="bi bi-x-lg"></i> Cerrar
    </button>
  </div>

  <dl class="row row-cols-2 row-cols-md-4 g-2 m-0">
    <div class="col" *ngFor="let dato of datos">
      <div class="eb-dato">
        <dt>{{ dato.etiqueta }}</dt>
        <dd>{{ dato.valor }}</dd>
      </div>
    </div>
  </dl>

  <p class="mt-3 mb-0 small text-suave">{{ player.biografia }}</p>
</article>
